schema_version: 1

context:
  version: "18.4"
  # pqver = "5.<major>" e.g. "5.18" for PostgreSQL 18.x
  pqver: "5.18"

recipe:
  name: postgresql-split
  version: ${{ version }}

source:
  url: https://ftp.postgresql.org/pub/source/v${{ version }}/postgresql-${{ version }}.tar.bz2
  sha256: 81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094
  patches:
    - patches/0002-disable-new-dtags.patch
    # setenv patches are NOT needed with MinGW — its POSIX layer provides setenv().
    # The X509_NAME macro conflict from <wincrypt.h> still applies with MinGW.
    - if: win
      then: patches/fix_x509_name_win.patch

build:
  number: 0

outputs:
  - package:
      name: postgresql
    build:
      # Single unified .sh script — runs under bash on Unix and MSYS2 on Windows.
      script: install_db.sh
    requirements:
      build:
        - if: unix
          then: gnuconfig
        - if: osx
          then: lld
        - if: win
          then: ${{ compiler('m2w64_c') }}
          else: ${{ compiler('c') }}
        - if: win
          then: ${{ stdlib('m2w64_c') }}
          else: ${{ stdlib('c') }}
        - if: unix
          then: make
        - if: unix
          then: pkg-config
        - if: unix
          then: bison
        # m2-* packages are the MSYS2 POSIX-layer tools available on conda-forge.
        # m2-bison and m2-flex do NOT exist as modern packages — they carry an
        # msys2-conda-epoch==20160418 constraint that conflicts with gcc_win-64 14+.
        # winflexbison provides win_bison.exe and win_flex.exe and is epoch-free.
        - if: win
          then: m2-base
        - if: win
          then: m2-make
        - if: win
          then: winflexbison
        - if: win
          then: m2-pkg-config
        - if: win
          then: m2-diffutils
        - if: win
          then: m2-perl
        - icu
      host:
        - icu
        - if: linux
          then: liburing
        - libxml2-devel
        - libxslt
        - krb5
        - if: not win
          then: openldap
        - openssl
        - lz4-c
        - zlib
        - zstd
        - if: not win
          then: readline
        - if: not win
          then: tzcode
        - if: not win
          then: tzdata
        - ${{ pin_subpackage('libpq', exact=True) }}
      run:
        - ${{ pin_subpackage('libpq', exact=True) }}
        - if: not win
          then: tzcode
        - if: not win
          then: tzdata
      run_exports:
        - ${{ pin_subpackage('libpq') }}
    tests:
      - requirements:
          run:
            - if: linux
              then: binutils
        script:
          - postgres --help
          - if: unix
            then: export TEST_DIR=./test_postgres
          - if: unix
            then: initdb -D $TEST_DIR
          - if: unix
            then: pg_ctl -D $TEST_DIR -l logfile start || cat ./logfile
          - if: unix
            then: pg_ctl -D $TEST_DIR stop
          - if: linux
            then: nm -D $(which postgres) | grep -q palloc0 || exit 1
    about:
      summary: PostgreSQL is a powerful, open source object-relational database system.
      license: PostgreSQL
      license_file: COPYRIGHT

  - package:
      name: postgresql-plpython
    build:
      skip:
        - win
      script: install_plpython.sh
    requirements:
      build:
        - if: build_platform != target_platform
          then: python
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - if: unix
          then: gnuconfig
        - if: osx
          then: lld
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - if: unix
          then: make
        - if: unix
          then: pkg-config
        - if: unix
          then: bison
        - icu
      host:
        - icu
        - libxml2-devel
        - libxslt
        - krb5
        - openldap
        - openssl
        - lz4-c
        - zlib
        - zstd
        - libuuid
        - readline
        - ${{ pin_subpackage('postgresql', exact=True) }}
        - python
      run:
        - ${{ pin_subpackage('postgresql', exact=True) }}
        - python
      run_exports:
        - ${{ pin_subpackage('postgresql-plpython') }}
    tests:
      - script:
          - python -c "import psycopg2" || true
    about:
      summary: The plpythonu postgresql extension
      license: PostgreSQL
      license_file: COPYRIGHT

  - package:
      name: libpq
    build:
      script: install_runtime.sh
    requirements:
      build:
        - if: unix
          then: gnuconfig
        - if: osx
          then: lld
        - if: win
          then: ${{ compiler('m2w64_c') }}
          else: ${{ compiler('c') }}
        - if: win
          then: ${{ stdlib('m2w64_c') }}
          else: ${{ stdlib('c') }}
        - if: unix
          then: make
        - if: unix
          then: pkg-config
        - if: unix
          then: bison
        # m2-* packages are the MSYS2 POSIX-layer tools available on conda-forge.
        # m2-bison and m2-flex do NOT exist as modern packages — they carry an
        # msys2-conda-epoch==20160418 constraint that conflicts with gcc_win-64 14+.
        # winflexbison provides win_bison.exe and win_flex.exe and is epoch-free.
        - if: win
          then: m2-base
        - if: win
          then: m2-make
        - if: win
          then: winflexbison
        - if: win
          then: m2-pkg-config
        - if: win
          then: m2-diffutils
        - if: win
          then: m2-perl
        - icu
      host:
        - icu
        - krb5
        - if: not win
          then: openldap
        - openssl
        - if: not win
          then: tzcode
        - if: not win
          then: tzdata
      run_exports:
        - ${{ pin_subpackage('libpq') }}
    tests:
      - script:
          - pg_config
          - if: linux
            then: test -f $PREFIX/lib/libpq.so.${{ pqver }}
          - if: linux
            then: test -f $PREFIX/lib/libpq.so.5
          - if: linux
            then: test -f $PREFIX/lib/libpq.so
          - if: osx
            then: test -f $PREFIX/lib/libpq.5.dylib
          - if: osx
            then: test -f $PREFIX/lib/libpq.dylib
          # MinGW installs DLLs under Library/bin (Windows ecosystem layout)
          - if: win
            then: test -f "$PREFIX/Library/bin/libpq.dll"
          - if: win
            then: test -f "$PREFIX/Library/bin/pg_config.exe"
    about:
      summary: The postgres runtime libraries and utilities (not the server itself)
      license: PostgreSQL
      license_file: COPYRIGHT

about:
  license: PostgreSQL
  license_file: COPYRIGHT
  summary: multi-output recipe for postgresql
  homepage: http://www.postgresql.org/

extra:
  recipe-maintainers:
    - akrherz
    - flaviomartins
    - gillins
    - msarahan
    - ocefpaf
    - mariusvniekerk
    - sodre
