# rattler-build variant configuration for postgresql-split
#
# Windows: MinGW-w64 GCC compiler stack (m2w64_c_compiler) replaces MSVC.
# The m2w64_c_compiler / m2w64_c_stdlib variables are picked up by the
# ${{ compiler('m2w64_c') }} and ${{ stdlib('m2w64_c') }} calls in recipe.yaml.

# -----------------------------------------------------------------------
# Windows — MinGW-w64 GCC toolchain
# -----------------------------------------------------------------------
m2w64_c_compiler:           # [win]
  - gcc                     # [win]
m2w64_c_compiler_version:   # [win]
  - 14                      # [win]
m2w64_c_stdlib:             # [win]
  - m2w64-sysroot           # [win]
m2w64_c_stdlib_version:     # [win]
  - 12                      # [win]

# -----------------------------------------------------------------------
# Linux — GCC + sysroot (glibc 2.17 minimum, conda-forge default)
# -----------------------------------------------------------------------
c_compiler:                 # [linux]
  - gcc                     # [linux]
c_stdlib:                   # [linux]
  - sysroot                 # [linux]
c_stdlib_version:           # [linux]
  - "2.17"                  # [linux]

# -----------------------------------------------------------------------
# macOS — clang 20 + SDK 11.0 (unchanged from original recipe)
# -----------------------------------------------------------------------
c_compiler:                 # [osx]
  - clang                   # [osx]
c_stdlib:                   # [osx]
  - macosx_deployment_target  # [osx]
c_stdlib_version:           # [osx]
  - "11.0"                  # [osx]
MACOSX_SDK_VERSION:         # [osx and x86_64]
  - 11.0                    # [osx and x86_64]
c_compiler_version:         # [osx]
  - 20.1                    # [osx]
lld:                        # [osx]
  - 20.1                    # [osx]

# -----------------------------------------------------------------------
# Shared dependency pins
# -----------------------------------------------------------------------
icu:
  - '78'
krb5:
  - '1.22'
libpq:
  - '18'
libxml2_devel:
  - '2.14'
lz4_c:
  - '1.10'
openssl:
  - '3.5'
zlib:
  - '1'
zstd:
  - '1.5'
